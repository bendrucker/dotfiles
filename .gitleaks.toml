[extend]
useDefault = true

# herdr keybindings are `key = "prefix+alt+minus"`, which generic-api-key reads
# as an assignment to something named `key` holding enough entropy to be a
# credential. Two commits in this repo's history trip it.
#
# Scoped by value shape rather than by path: gitleaks applies an allowlist whose
# `condition = "AND"` includes `paths` to every finding under those paths, so
# adding `paths` here would exempt the whole file instead of these lines. The
# regex only matches a modifier chord, which no credential looks like.
[[allowlists]]
description = "herdr keybinding declarations"
regexTarget = "line"
regexes = ['''^\s*key\s*=\s*"(prefix|ctrl|alt|shift|super)(\+[a-z0-9]+)+"\s*$''']

# The history filters' corpus is credential-shaped strings by construction. Every
# entry is there to prove a filter drops it, so a scan of the file reports the
# fixtures and nothing else.
#
# Exempting the whole path, unlike the entry above. There is no one value shape
# to match: the corpus spans every vendor prefix the two filters know and gains
# another whenever a filter does. The cost is that a real credential pasted into
# this file would go unreported, which is the trade the file's own contents make
# unavoidable.
[[allowlists]]
description = "history filter test fixtures"
paths = ['''^packages/history-secrets\.ts$''']
