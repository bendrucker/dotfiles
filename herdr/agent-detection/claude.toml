# Detection rules herdr's own `claude` manifest is missing.
# `bin/herdr-agent-detection` appends this file to whatever manifest herdr last
# fetched and installs the result. Nothing upstream is copied in here.
#
# herdr scores `working` for Claude Code off the terminal title, whose first
# character is a braille spinner frame. Claude Code writes that title only while
# it streams a response. Through every tool call the title is
# `<summary> · <session id>` with no prefix, so the highest matching rule becomes
# `live_prompt_box` and the pane reads idle while the agent is mid-turn. On a
# live session that showed up as state flipping to idle every few seconds for
# stretches of one to four seconds.
#
# The screen carries the state the title drops, in two places. The status line
# above the input box says the turn is still open, and the agent tree below it
# says a fan-out is still running after the turn closed. One rule each, below.
#
# Both are redundant once herdr scores `working` from something other than the
# title, and two things watch for it. `herdr-agent-detection check` compares the
# set below against the manifest and reports when it moves, and it rescores every
# screen under herdr/agent-detection/screens with this file and without it and
# reports when the two agree. The set is a proxy, since herdr can fix how a rule
# matches without changing which rules exist; the rescore is the measurement.
# `herdr-agent-detection ablate` says which single rule is carrying which screen.
# base-working-rules: btw_overlay_working osc_title_working

[[rules]]
id = "local_spinner_line_working"
state = "working"
# Above `live_prompt_box` (950), so the input box stops reading as idle mid-turn.
#
# It does not sit below the blocked rules: `bash_permission_prompt` (850),
# `generic_permission_prompt` (840), and `legacy_no_prompt_blocker` (300) all
# rank under this. That ordering is upstream's, and `live_prompt_box` at 950
# outranks them too. What keeps a permission prompt visible is the `not` block
# below: `live_prompt_box` stands down on a prompt screen so the blocked rules
# can win, and this rule has to stand down with it. Otherwise a stray match here
# would report `working` at the one moment the agent is waiting on input.
priority = 960
# Counted from the bottom, the spinner sits above the input box, its two rules,
# and the footer. The footer is not a fixed height: Claude Code draws a row per
# running subagent, which measured 7 non-empty lines to the spinner with none
# running and 9 with two. A tight region silently stops matching exactly when a
# pane is busiest, so this leaves room for the footer to grow rather than
# fitting today's.
region = "bottom_non_empty_lines(20)"
visible_working = true
# Two shapes of the line, because Claude Code draws it two ways.
#
# The first matches `✻ Crunching… (18m 20s · ↓ 53.5k tokens)` and the older
# `(esc to interrupt)` form. The second matches `✻ Waiting for 2 background
# agents to finish` and `✻ Waiting for 1 dynamic workflow to finish`, which
# carry no ellipsis and no parenthetical and so fall outside the first.
#
# The second shape is where the flapping actually came from. Blocked on a
# subagent, Claude Code stops streaming and rewrites the title to its idle
# `<dir> · <summary> · <session>` form, so `osc_title_working` stands down and
# `live_prompt_box` takes the pane to idle for as long as the wait lasts.
# Sampling every pane once a second caught 13 `working → done` transitions and
# 12 of them had one of these lines above the input box.
#
# A region this deep holds ordinary transcript text, so the patterns carry the
# precision instead. Both anchor at column 0, where Claude Code draws its own
# chrome and never indented response prose. `❯` is excluded so a spinner line
# pasted into the input box does not match itself. The first requires its
# parenthetical to close at end of line and hold either `esc to interrupt` or a
# duration followed by the `·` separator, which is what separates a live
# spinner from prose like `- Building… (2m 10s elapsed)`. The second requires
# the count and the `to finish` suffix.
#
# The two shapes differ in how they end, and the second is the weaker of them.
# Claude Code redraws the spinner line in place, so it is gone the moment the
# turn is, while each `Waiting for` line stays where it was printed and the next
# one appears below it. A turn that ends within a few lines of its last wait
# therefore leaves a matching line inside the region and holds the pane at
# working. Every wait is followed by at least the agent-finished line, the reply
# that reads it, and the tool-call summary, which is what keeps the real screens
# clear of it: across 1117 samples of idle, done, and blocked panes the pattern
# never matched, and across 27 `working → done` transitions every line it did
# match was the live one. When that stops holding, the symptom is a pane left at
# working with an empty input box and no spinner.
#
# A pane pinned at `working` while idle is worse than the flapping this fixes,
# which is why every one of those narrowings is here, and why a bare
# `<glyph> Word…` alternative is not. It would cover `✳ Forging…`, the shape
# Claude Code draws in the second before the timer appears, at the cost of
# matching the `✻ Thinking…` that stays in the transcript afterward. Sampled
# against live panes it fired twice, once on a working pane and once on an idle
# one. The `Waiting for` pattern fired 131 times over the same window, every one
# of them on a working pane and none across 1117 idle, done, and blocked
# samples.
#
# The two shapes go in `any` because the matchers within one rule are ANDed.
# Two entries in a single `line_regex` would demand a screen holding both lines
# at once, which no live pane draws, and the rule would stop matching anything
# at all rather than matching more.
any = [
  { line_regex = ['^[^❯\s] [^(]*…\s*\((?:\d+[hms][^)]*·|esc to interrupt)[^)]*\)\s*$'] },
  { line_regex = ['^[^❯\s] Waiting for \d+ [a-z ]+ to finish\s*$'] },
]
# Stand down on an approval screen, so the blocked rules below can win.
#
# `live_prompt_box` spells this as five separate `contains`, any one of which
# disqualifies. That works there because its region is `prompt_box_body`, which
# holds nothing but the box, so each phrase can only have come from the box
# drawing a picker. This region reaches twenty lines up into the transcript,
# where the same phrases are ordinary prose: a pane whose agent so much as
# quotes `esc to cancel` disqualifies itself, and the disqualification lasts
# until enough output scrolls it out of range. That is a working pane reading
# idle, which is the bug this file exists to fix, arriving through the door
# meant to guard it.
#
# So key on the shape rather than the words: `❯` on a numbered choice, which is
# the selected option of a picker and which prose does not produce. The wording
# drifts and the shape has not. Claude Code 2.1.234 asks `Do you want to allow
# this connection?` and offers `(esc)`, matching neither the `esc to cancel` the
# blocked rules require nor a `do you want to proceed?` a phrase guard here would
# name, so a guard spelled in words stands down on the very screen it was written
# for and reports working while the pane waits on a person.
not = [
  { line_regex = ['^\s*❯\s*\d\.\s'] },
]

# Background agents outliving the turn that dispatched them.
#
# A fan-out returns the main thread to the prompt while its agents keep running,
# so the pane is genuinely accepting input and `live_prompt_box` is right about
# that. It reads as finished all the same, and each agent reporting back wakes
# the main thread, which is the second half of the done/working cycling this
# overlay exists to stop. Nothing here is a detection gap: herdr has four states
# and none of them mean "free, but still cooking". This spends `working` on it.
#
# Claude Code draws the agent tree under the input box, so the region is the
# footer and holds no transcript text at all. That is the whole reason this is a
# separate rule rather than another branch of the one above, whose region has to
# reach up into the transcript and pays for it in precision.
[[rules]]
id = "local_background_agent_working"
state = "working"
# Above `live_prompt_box` (950), which is the rule it exists to outrank.
priority = 955
region = "after_last_horizontal_rule"
visible_working = true
# The tree lists every agent, so the count of rows says nothing. A running one
# carries a live elapsed time and token count, `◯ 󰚩 Running python3 · 10m 24s ·
# 57.6k` or `◯ writing-cleanup  You are cleaning up… 14s · ↓ 40.5k tokens`. One
# that is not running ends in the literal word `idle` and has neither. Matching
# the counter positively is what keeps a drained tree from holding the pane at
# working, and it has to be per-line: a tree mixing running and idle agents is
# the normal case, so a rule-level `not` on `idle` would stand down exactly when
# the answer is yes.
#
# The `k` is optional because an agent under a thousand tokens has none, and the
# first seconds of a fan-out are when every agent is under a thousand tokens.
# Requiring it would blind the rule to the exact moment it exists for, the one
# where the main thread has just handed off and gone back to the prompt.
#
# What replaces it as the precision is the end anchor. A running row ends on its
# counter, `· 57.6k` or `· ↓ 40.5k tokens`; an idle row ends on the word `idle`.
# Without the anchor the counter can be satisfied by the row's description text
# instead, and a drained tree listing `Ran the suite in 12s · 5 files chang…
# idle` holds the pane at working for good. A pane stuck working is worse than
# the flapping this file fixes, because nothing later clears it.
line_regex = ['^\s*◯ .*\d+s · (?:↓ )?\d+(?:\.\d+)?k?(?: tokens)?\s*$']
# Same guard as the rule above, for the same reason. Claude Code keeps drawing
# the footer under a permission prompt, so without this the footer would answer
# `working` at the one moment the pane is waiting on a person.
not = [
  { line_regex = ['^\s*❯\s*\d\.\s'] },
]
