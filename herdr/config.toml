# herdr — agent multiplexer. https://herdr.dev/docs/configuration/
# Dump the full default config with: herdr --default-config

onboarding = false

[update]
# The version is pinned in mise.toml and bumped by Renovate, so a background
# check can only ever nag about a version this machine won't install.
# manifest_check stays on: that's the agent-detection manifest, not the binary.
version_check = false

[keys]
# Match tmux's C-s so muscle memory carries over; when nested, double the
# prefix (tmux send-prefix) to reach herdr.
prefix = "ctrl+s"

[theme]
# ghostty already flips Mocha/Latte with the system appearance and reports the
# change to the pane (terminal/ghostty.config), so herdr's chrome can follow the
# same signal instead of needing a theme-sync-herdr script. Picking a theme by
# hand in herdr's settings turns auto_switch back off.
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui.toast]
# Surface agent state changes (blocked / working / done) as native toasts.
delivery = "herdr"

# Claude Code writes what it's doing to the terminal title. The default agent
# row is just ["agent"], which is the same word on every entry; trading it for
# the title makes the sidebar answer "what is each agent doing" at a glance.
# An override replaces the default rows rather than extending them.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["agent", "terminal_title_stripped"],
]

# --- Plugin keybindings ----------------------------------------------------
# Plugins themselves are installed by install.sh. The command IDs below come
# from each plugin's herdr-plugin.toml.

# herdr-navigator — fuzzy jump to any workspace, agent, project, or session.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

# herdr-file-viewer — git-aware, read-only file browser (diffs, markdown, code).
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "file viewer (pane)"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "file viewer (tab)"

# herdr-worktrunk — worktree switch/create/remove through worktrunk, so the
# lifecycle hooks that `wt` already runs fire on a worktree made from herdr.
# prefix+shift+g is herdr's built-in "new worktree"; a custom binding on the same
# key takes precedence, which is how the built-in gets replaced rather than
# shadowed. The plugin's own id is `worktrunk`, not the repo name.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"
