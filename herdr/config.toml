# herdr — agent multiplexer. https://herdr.dev/docs/configuration/
# Dump the full default config with: herdr --default-config

onboarding = false

[update]
# brew owns the binary (herdr/Brewfile), so herdr update stays out of it.
# manifest_check stays on: that's agent detection, not the binary.
channel = "stable"
version_check = false

[session]
resume_agents_on_restore = true

[keys]
# Ghostty maps Hyper+A to the same byte (terminal/ghostty.config).
prefix = "ctrl+s"

# Native creation lands in ~/.herdr/worktrees, outside the worktrunk layout.
# Use the worktrunk plugin bindings below.
new_worktree = ""

[theme]
# ghostty flips Mocha/Latte with the system appearance and reports it to the
# pane (terminal/ghostty.config). Picking a theme by hand turns this back off.
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

# `machine` is omitted while Local is the only machine, and its rule dims Local
# rather than coloring the remotes, so adding a machine changes nothing here.
# The Claude row trades the agent glyph for the session name, which herdr reads
# off the pane title. The stripped form drops the leading state glyph, which
# would otherwise flicker with the spinner.
[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    "agent",
    { token = "machine", rules = [{ equals = "Local", dim = true }] },
    "workspace",
    "tab",
  ],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "terminal_title_stripped", bold = true, dim = false }],
  [
    { token = "machine", dim = false, rules = [{ equals = "Local", dim = true }] },
    { token = "workspace", bold = false, dim = true },
    { token = "tab", dim = true },
  ],
]

# bin/herdr-workspace-status reports these tokens in place of herdr's `branch`
# and `git_status`. herdr strips escape codes from token values, so color rides
# on the token name. `$status_*` is at most two glyphs, since herdr right-aligns
# custom tokens by truncating the workspace label. Hex only, picked to read on
# both catppuccin flavors.
[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "workspace",
    { token = "$status_red", fg = "#e0405a" },
    { token = "$status_yellow", fg = "#d9a33a" },
    { token = "$status_green", fg = "#5fb760" },
    "$status_plain",
    { token = "$status_mauve", fg = "#a678f0" },
    { token = "$status_dim", dim = true },
  ],
  ["$branch"],
]

# Plugins are installed by install.sh. The command IDs come from each plugin's
# herdr-plugin.toml.

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-zoxide.browse"
description = "open a directory as a workspace"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "file viewer (pane)"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "file viewer (tab)"

# reviewr's auto-open is off (reviewr.toml), so this is the only way in.
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "herdr plugin action invoke toggle --plugin persiyanov.reviewr"
description = "reviewr diff (toggle)"

# The nvim half is declared in neovim/config/init.lua. Its file picker is
# unbound; reach it with `herdr plugin action invoke pick-file --plugin
# chmarax.herdr-nvim`.
[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar (toggle)"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch / create (default branch)"

[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "worktrunk.open-current"
description = "worktree: switch / create (current branch)"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "zenbu-labs.tode.open-split"
description = "terminal-code (right split)"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "terminal-browser (right split)"

# herdr-annotate works off what herdr copies to the system clipboard, so it
# annotates any pane's scrollback. herdr-nvim above covers the buffers it has
# open.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate the terminal selection"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as agent context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review, on the plannotator-tui binary the plugin fetches at build
# time. Both send feedback back to the focused pane's agent as its next
# message. A Ctrl-click on a file:// Markdown link needs no key.
[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "herdr-grab-scrollback"
description = "copy scrollback to the clipboard"

# The sidebar lists pane agents, and a background agent occupies no pane.
[[keys.command]]
key = "prefix+alt+a"
type = "popup"
command = "herdr-claude-agents"
description = "claude background agents"
width = "85%"
height = "85%"

# Spelled out rather than named bare: the server holds the environment it
# started with, so a bare name resolves against a PATH that can predate
# herdr/path.zsh. $ZSH keeps this on a dev checkout while dev mode is on.
[[keys.command]]
key = "prefix+alt+f"
type = "shell"
command = "${ZSH:-$HOME/.dotfiles}/herdr/bin/herdr-flock"
description = "flock coordinator (focus or create)"

[ui]
agent_panel_sort = "priority"

# The only scheduler herdr offers a script that is not a plugin.
# herdr-workspace-status prints nothing, so the entry stays blank and the run is
# what it is for: reporting the $tokens the spaces rows render. Those carry a
# ten minute TTL. Each worktree costs one forge list call per run, plus one per
# open pull request.
tab_bar_right = [
  { type = "command", command = "herdr-workspace-status", interval_seconds = 30, timeout_seconds = 25 },
]

[terminal]
# terminal-browser paints nothing without this.
kitty_graphics = true

[experimental]
pane_history = true
