# herdr — agent multiplexer. https://herdr.dev/docs/configuration/
# Dump the full default config with: herdr --default-config

onboarding = false

[update]
# herdr installs via Homebrew (herdr/Brewfile), upgraded by the nightly
# dotfiles-upgrade run of brew. Declaring stable here (rather than the
# `herdr channel set preview` run once by hand) makes the tracked config
# authoritative and keeps `herdr update` from fighting the brew-managed
# binary. version_check stays off since brew already owns upgrades and a
# background nag can't act on itself. manifest_check stays on since that's
# the agent-detection manifest, not the binary.
channel = "stable"
version_check = false

[keys]
# Match tmux's C-s so muscle memory carries over; when nested, double the
# prefix (tmux send-prefix) to reach herdr.
prefix = "ctrl+s"

# Native worktree creation lands in ~/.herdr/worktrees, outside the worktrunk
# layout (~/src/.worktrees/{owner}/{repo}/{branch}). Unbound in favor of the
# worktrunk plugin bindings below.
new_worktree = ""

[theme]
# ghostty already flips Mocha/Latte with the system appearance and reports the
# change to the pane (terminal/ghostty.config), so herdr's chrome can follow the
# same signal instead of needing a theme-sync-herdr script. Picking a theme by
# hand in herdr's settings turns auto_switch back off.
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui.toast]
# Surface agent state changes (blocked / working / done) as native toasts.
delivery = "herdr"

# One row per agent, and nothing in it that changes faster than the agent's
# state.
#
# `terminal_title_stripped` used to sit on a second row, on the theory that
# Claude Code's title answers "what is each agent doing". It does not survive
# a 26-column sidebar. The title is `<cwd basename> · <turn summary> ·
# <session id>`, so the part that fits is the cwd, which `workspace` already
# says, and the part that would earn the row is truncated away. What does
# arrive is motion: the summary changes every turn, and Claude Code prefixes a
# spinner frame while it streams, so the row animates in the corner of the eye
# for the whole session.
#
# `agent` stays because its glyph is per-CLI and changes only when the pane's
# occupant does. It moves onto the first row so keeping it costs no height.
# This is `rows` rather than `rows_by_agent` since none of it is Claude-specific.
[ui.sidebar.agents]
rows = [["state_icon", "agent", "workspace", "tab"]]

# --- Plugin keybindings ----------------------------------------------------
# Plugins themselves are installed by install.sh. The command IDs below come
# from each plugin's herdr-plugin.toml.

# Switching splits in two: native goto (prefix+g) reaches anything that already
# has a workspace, and this reaches a directory that doesn't have one yet.
# herdr-navigator used to cover both, but it paints Catppuccin Mocha regardless
# of auto_switch above (thanhdat77/herdr-navigator#28), so it's dropped until
# that's fixed. herdr-zoxide passes no --color, so its fzf picker inherits
# FZF_DEFAULT_OPTS_FILE and follows the system appearance.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-zoxide.browse"
description = "open a directory as a workspace"

# herdr-file-viewer — git-aware, read-only file browser (diffs, markdown, code).
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "file viewer (pane)"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "file viewer (tab)"

# reviewr's auto-open is off (reviewr.toml), so this is the only way in.
# herdr's resize mode already holds prefix+r.
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "herdr plugin action invoke toggle --plugin persiyanov.reviewr"
description = "reviewr diff (toggle)"

# herdr-nvim — a per-tab nvim in a full-height split, plus a picker over the
# files the agent just touched. The plugin has an nvim half too, declared in
# neovim/config/init.lua, which is what sends annotations back to an agent.
# Its README suggests prefix+e and prefix+o, both of which herdr already binds
# (edit_scrollback, open_notification_target), so these take the shift variants
# the same way the file viewer does above.
[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar (toggle)"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "nvim sidebar: open a file the agent touched"

# worktrunk — routes worktree creation through wt instead of herdr's native
# flow (see new_worktree above). prefix+shift+g reuses the native flow's key
# so muscle memory carries. prefix+ctrl+g is the stacking entry point.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch / create (default branch)"

[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "worktrunk.open-current"
description = "worktree: switch / create (current branch)"

# herdr-mirror mirrors a remote herdr server's workspaces and agents into the
# local sidebar. Its hosts live in ~/.config/herdr-mirror/hosts.toml, untracked
# because every entry is an ssh target.
#
# That file also carries `autostart = false`, so focusing a workspace no longer
# pulls the remote in. One sidebar holding both machines loses the separation
# that makes the second machine useful: which agents are here and which are over
# there stops being answerable at a glance, and the rows that scroll past are
# mostly not the ones being worked on. Mirroring is per-sitting instead of
# ambient, which is what the two keys below are for.
#
# teardown closes the local mirrors and nothing else. The remote panes and their
# agents keep running, and start re-mirrors them from scratch. The rest of the
# lifecycle (pause, status, once, restore) stays on the herdr-mirror the install
# links into ~/.local/bin, where it reads fine as a typed command.
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "mirror.start"
description = "remote: mirror hosts into the sidebar"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "mirror.teardown"
description = "remote: stop mirroring, close every mirror"

# Creating objects on the remote. These four have no CLI equivalent worth
# typing: each takes its host and cwd from the mirror it's invoked from, and
# degrades to the plain local action outside one. Native key plus alt, so both
# sets stay reachable.
[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "mirror.remote-new-workspace"
description = "remote: new workspace"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "mirror.remote-new-tab"
description = "remote: new tab"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "mirror.remote-split-right"
description = "remote: split right"

[[keys.command]]
key = "prefix+alt+minus"
type = "plugin_action"
command = "mirror.remote-split-down"
description = "remote: split down"

# terminal-code (tode) and terminal-browser — a VS Code and a browser, each in
# a right-hand split. Both ship a CLI on PATH (~/.local/bin, zsh/.zshenv) whose
# `--split right` is what the plugin action shells out to, so these keys buy
# reaching them without a shell prompt. prefix+b and prefix+c are herdr's
# toggle_sidebar and new_tab, so both take the shift variant the same way the
# file viewer and nvim do above.
#
# terminal-browser overlaps ogulcancelik/herdr-browser, which stays: that one
# owns the link handler that opens a localhost URL from a pane, and this one
# has the `terminal-browser action` CLI an agent drives. Nothing is bound to
# herdr-browser, so they don't contend for a key.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "zenbu-labs.tode.open-split"
description = "terminal-code (right split)"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "terminal-browser (right split)"

[ui]
agent_panel_sort = "priority"

[experimental]
# herdr server restarts (done for config/plugin changes) currently lose pane
# screen history. This preserves it across restarts.
pane_history = true
