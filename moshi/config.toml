# moshi-hook reads this at daemon start, and reload.sh restarts the daemon when
# it changes. `moshi-hook set` edits it in place through the symlink, so a
# setting changed that way shows up as a diff in this repo.

[gateway]
always_on_discovery = true
usage_collection = true
# Push to the phone only while the Mac's console is locked.
suppress_push_while_unlocked = true
