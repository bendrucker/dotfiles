# The command line tools this repo's scripts, tests, and CI call, pinned so a
# breaking release arrives as a Renovate PR that CI judges before it reaches a
# machine. Renovate batches this file into one weekly PR and automerges it,
# majors included. Tools used only by hand stay on Homebrew and track latest.
[tools]
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:ast-grep/ast-grep" = "0.45.3"
"github:duckdb/duckdb" = "2.0.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:j178/prek" = "0.5.5"
"aqua:jqlang/jq" = "1.8.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:sharkdp/fd" = "10.5.0"
"aqua:sharkdp/hyperfine" = "2.0.0"

[dotfiles]
"~/.hushlogin" = { content = "" }
"~/.config/btop/themes/catppuccin_frappe.theme" = "btop-catppuccin/themes/catppuccin_frappe.theme"
"~/.config/btop/themes/catppuccin_latte.theme" = "btop-catppuccin/themes/catppuccin_latte.theme"
"~/.config/btop/themes/catppuccin_macchiato.theme" = "btop-catppuccin/themes/catppuccin_macchiato.theme"
"~/.config/btop/themes/catppuccin_mocha.theme" = "btop-catppuccin/themes/catppuccin_mocha.theme"

[tasks."system:install"]
run = "./system/install.sh"
dir = "{{config_root}}/.."

# Each lint task checks the checkout it runs from, so `mise run lint` at the
# root of a worktree lints that worktree rather than the installed copy.
[task_config]
dir = "{{cwd}}"

[tasks.lint]
depends = ["lint:*"]

[tasks."lint:completion-naming"]
run = "if find . -name completions.zsh -not -path './.git/*' | grep .; then echo 'rename to completion.zsh, the only name the deferred completion filter matches' >&2; exit 1; fi"

[tasks."lint:zsh-depth"]
run = "if git ls-files '*.zsh' | awk -F/ 'NF != 2' | grep .; then echo 'move into a topic directory, the only level zsh/.zshrc and zsh/.zshenv load .zsh files from' >&2; exit 1; fi"

[tasks."lint:glyphs"]
run = "bin/glyph-scan"

[tasks."lint:expired"]
run = "scripts/lint-expired"

[tasks."lint:spinners"]
run = "scripts/lint-spinners"

# A bare `bunx oxlint` resolves the latest release and ignores the pin, so the
# install is what makes the version in package.json the one that runs.
[tasks."lint:ts"]
run = [
  "bun install --frozen-lockfile",
  "bun test scripts/lint-ts.test.ts",
  "scripts/lint-ts --deny-warnings ${GITHUB_ACTIONS:+--format=github}",
]

# The gitleaks pre-commit hook scans the staged diff, so a push that skipped it
# is caught only by scanning what was pushed. The tree scan covers merge commits
# and content git treats as binary. The history scan covers a secret added and
# deleted again, which a public repo still hands out. --log-opts HEAD keeps it
# to this branch rather than every ref a full fetch brings.
[tasks."lint:secrets"]
run = [
  "gitleaks dir --redact --no-banner --no-color --max-target-megabytes 5 .",
  "gitleaks git --redact --no-banner --no-color --log-opts HEAD .",
]
