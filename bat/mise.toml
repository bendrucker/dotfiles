[dotfiles]
"~/.config/bat/config" = "config"
"~/.config/bat/themes/Catppuccin Frappe.tmTheme" = "catppuccin/themes/Catppuccin Frappe.tmTheme"
"~/.config/bat/themes/Catppuccin Latte.tmTheme" = "catppuccin/themes/Catppuccin Latte.tmTheme"
"~/.config/bat/themes/Catppuccin Macchiato.tmTheme" = "catppuccin/themes/Catppuccin Macchiato.tmTheme"
"~/.config/bat/themes/Catppuccin Mocha.tmTheme" = "catppuccin/themes/Catppuccin Mocha.tmTheme"

# Rebuild the theme cache so bat recognizes the catppuccin .tmTheme files.
[tasks."bat:install"]
run = "bat cache --build >/dev/null"
