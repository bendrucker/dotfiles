repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "--source-path=SCRIPTDIR", "-e", "SC1071"]

  - repo: https://github.com/boidolr/ast-grep-pre-commit
    rev: v0.2.0
    hooks:
      - id: ast-grep
        files: (Brewfile$|\.(sh|zsh)$)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: ast-grep-test
        name: ast-grep rule tests
        language: system
        entry: ast-grep test --skip-snapshot-tests
        files: ^(rules|rule-tests)/
        pass_filenames: false
      - id: skill-tests
        name: skill tests
        language: system
        entry: bun test ./.claude/skills/
        files: ^\.claude/skills/.*\.(sh|ts)$
        pass_filenames: false
      - id: oxlint
        name: oxlint
        language: system
        entry: bunx oxlint@1.82.0 --deny-warnings
        types: [ts]
        pass_filenames: false
