repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "--source-path=SCRIPTDIR", "-e", "SC1071"]

  - repo: https://github.com/boidolr/ast-grep-pre-commit
    rev: v0.2.0
    hooks:
      - id: ast-grep
        files: (Brewfile$|\.(sh|zsh)$)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format

  # gitleaks-system runs the brew-installed binary, so the Brewfile owns the
  # version. The repo's other two ids build it from source or pull a Docker
  # image. pass_filenames is an override, not a preference: upstream omits it on
  # this id alone, and `gitleaks git` takes at most one path, so a commit
  # touching two files fails on argument count rather than on a secret.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        args: ["--no-banner", "--no-color"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: ast-grep-test
        name: ast-grep rule tests
        language: system
        entry: ast-grep test --skip-snapshot-tests
        files: ^(rules|rule-tests)/
        pass_filenames: false
      - id: skill-tests
        name: skill tests
        language: system
        entry: bun test ./.claude/skills/
        files: ^\.claude/skills/.*\.(sh|ts)$
        pass_filenames: false
      - id: herdr-config
        name: herdr config check
        language: system
        entry: env HERDR_CONFIG_PATH=herdr/config.toml herdr config check
        files: ^herdr/
        pass_filenames: false
      - id: oxlint
        name: oxlint
        language: system
        entry: bash -c 'bun install --frozen-lockfile && exec scripts/lint-ts --deny-warnings'
        # Not types: [ts]. identify tags an extensionless bun executable as
        # `executable` and nothing more, so a change to one of the largest
        # TypeScript files here would not fire a hook keyed on that tag. Every
        # extensionless path matches rather than the two directories that hold
        # one today, because the shebang is what decides which of them lint-ts
        # mirrors and a prefix here would be a second answer to that.
        files: (\.ts$|^\.oxlintrc\.json$|(^|/)[^./]+$)
        pass_filenames: false
