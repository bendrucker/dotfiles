[tools]
go = "1.27.1"
"aqua:golangci/golangci-lint" = "2.14.0"
# A failed signature leaves the install incomplete, which mise will not run.
"go:github.com/bendrucker/tailgate" = { version = "0.0.0-20261125052933-88d34312cc79", postinstall = '{{config_root}}/../macos/tailgate/sign "$MISE_TOOL_INSTALL_PATH/bin/tailgate"' }
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
"go:github.com/golang/mock/mockgen" = "1.6.0"
"go:github.com/spf13/cobra-cli" = "1.3.0"
"go:github.com/traefik/yaegi/cmd/yaegi" = "0.16.1"
"go:github.com/x-motemen/gore/cmd/gore" = "0.7.0"
