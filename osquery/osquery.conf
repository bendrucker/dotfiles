{
  "options": {
    "host_identifier": "hostname",
    "logger_min_status": 1,
    "logger_rotate": true,
    "logger_rotate_size": 26214400,
    "logger_rotate_max_files": 90,
    "disable_events": true,
    "disable_distributed": true
  },
  "schedule": {
    "pressure": {
      "platform": "darwin",
      "interval": 10,
      "snapshot": true,
      "query": "SELECT (SELECT current_value FROM system_controls WHERE name = 'kern.memorystatus_vm_pressure_level') AS pressure_level, (SELECT current_value FROM system_controls WHERE name = 'kern.memorystatus_level') AS available_pct, (SELECT current_value FROM system_controls WHERE name = 'vm.swapusage' AND field_name = 'xsu_used') AS swap_used_mb, (SELECT current_value FROM system_controls WHERE name = 'vm.loadavg' AND field_name = 'ldavg0') AS load1, v.free, v.wired, v.compressor, v.compressed, v.decompressed, v.swap_ins, v.swap_outs, v.page_ins, v.page_outs FROM virtual_memory_info v;"
    },
    "host_cpu": {
      "interval": 10,
      "snapshot": true,
      "query": "SELECT sum(user) AS user, sum(nice) AS nice, sum(system) AS system, sum(idle) AS idle FROM cpu_time;"
    },
    "procs": {
      "interval": 60,
      "snapshot": true,
      "query": "SELECT upid, uppid, pid, parent, name, cwd, start_time, total_size AS footprint, resident_size, user_time, system_time, disk_bytes_read, disk_bytes_written, threads FROM processes WHERE total_size > 67108864 OR disk_bytes_written > 268435456 OR user_time > 60000;"
    },
    "proc_groups": {
      "interval": 10,
      "snapshot": true,
      "query": "SELECT name, count(*) AS processes, sum(threads) AS threads, sum(user_time + system_time) AS cpu_time, sum(disk_bytes_read) AS disk_bytes_read, sum(disk_bytes_written) AS disk_bytes_written FROM processes GROUP BY name HAVING processes > 3 OR threads > 50;"
    },
    "proc_tags": {
      "interval": 30,
      "removed": false,
      "query": "SELECT p.upid, p.pid, p.name, p.start_time, e.key, e.value FROM processes p JOIN process_envs e ON e.pid = p.pid WHERE p.uid = (SELECT uid FROM processes WHERE pid = (SELECT pid FROM osquery_info)) AND e.key IN ('CLAUDE_CODE_SESSION_ID', 'HERDR_PANE_ID');"
    },
    "osquery_self": {
      "interval": 3600,
      "snapshot": true,
      "query": "SELECT name, executions, user_time, system_time, wall_time_ms, average_memory, output_size FROM osquery_schedule;"
    }
  }
}
