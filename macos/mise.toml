# A signed and attested release. The verify script fails the install on any
# other signature, and mise won't run an incomplete install.
[tools."github:bendrucker/tailgate"]
version = "0.1.0"
asset_pattern = "tailgate-darwin-arm64"
os = ["macos"]
postinstall = '{{config_root}}/tailgate-verify "$MISE_TOOL_INSTALL_PATH/tailgate"'

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0.0
apps = []

[bootstrap.macos.defaults."com.apple.dock"]
persistent-others = []
contents-immutable = false

[bootstrap.macos.defaults.NSGlobalDomain]
# tracking: 2nd fastest setting
"com.apple.mouse.scaling" = 2.5
AppleICUForce24HourTime = true

# right click for Magic Mouse 2
[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.mouse"]
MouseButtonMode = "TwoButton"

# monday: first day of week
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "AppleFirstWeekday"
path = ["gregorian"]
value = 2

# Spotlight > Show Spotlight search : ^Space
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 49, 262144] } }

[bootstrap.hooks]
post-defaults = "killall Dock SystemUIServer 2>/dev/null || true"

[bootstrap.macos.launchd.agents.theme-sync]
program = "/bin/zsh"
args = ["-lc", 'exec "$HOME/.dotfiles/theme/bin/watch-theme-change"']
run_at_load = true
keep_alive = true
stdout_path = "/tmp/theme-sync.log"
stderr_path = "/tmp/theme-sync.log"
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }

[tasks."macos:install"]
run = "./macos/install.sh"
dir = "{{config_root}}/.."
