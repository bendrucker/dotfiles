# Leave the casks that update themselves to their own updater on a managed
# machine or from the nightly job. Homebrew cannot move a root-owned app aside
# without sudo, and 3am has no terminal.
#
# scripts/install runs this from homebrew/. {{config_root}} is no help: once
# conf.d also reaches this file, mise renders it as $HOME.
[bootstrap.hooks]
pre-packages = """
set -e
cd ..
. scripts/shell/trace.sh

trace_begin install-trust
./scripts/install-trust
trace_end

trace_begin install-cask-variants
./scripts/install-cask-variants
trace_end

if ./scripts/brew-leave-self-updating; then
  export HOMEBREW_NO_UPGRADE_AUTO_UPDATES_CASKS=1
fi

trace_begin "brew bundle"
brew bundle
trace_end
"""
