[tools]
"github:RivoLink/leaf" = "1.29.1"

# iTerm2 expands ~ in this path itself.
[bootstrap.macos.defaults."com.googlecode.iterm2"]
PrefsCustomFolder = "~/.dotfiles/terminal"
LoadPrefsFromCustomFolder = true

[dotfiles]
"~/.config/ghostty/config" = "ghostty.config"
"~/.config/yazi/theme.toml" = "yazi-theme.toml"
"~/.config/yazi/package.toml" = "yazi-package.toml"

[tasks."terminal:install"]
run = "./terminal/install.sh"
dir = "{{config_root}}/.."

# SIGUSR2 reloads Ghostty's config like its reload_config keybind. pkill exits 1
# when Ghostty isn't running, as on CI.
[tasks."terminal:reload"]
run = "pkill -USR2 -x ghostty 2>/dev/null || true"
timeout = "60s"
