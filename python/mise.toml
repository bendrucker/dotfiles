[vars]
# renovate: datasource=github-releases depName=astral-sh/uv
uv_default = "0.12.18"

# uv refuses to run under a version that misses a project's
# `[tool.uv] required-version`, so follow the nearest pyproject.toml that pins
# an exact one (`==X.Y.Z` or bare `X.Y.Z`). Any other specifier, or no pin,
# gets the default. Tera v2 reads escapes in string literals, hence `\\[`.
[tools]
uv = '''
0.12.18'''
python = "3.14.7"
