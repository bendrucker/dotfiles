[dotfiles]
"~/.config/rex" = "config"

[tasks."rex:reload"]
run = "./rex/reload.sh"
dir = "{{config_root}}/.."
timeout = "60s"
depends_post = ["rex:settings"]

[tasks."rex:settings"]
description = "Apply settings.json to the running Rex Mac app"
run = "if command -v bun >/dev/null; then bun rex/settings.ts; fi"
dir = "{{config_root}}/.."
timeout = "60s"

[tasks."rex:try"]
description = "Load a worktree's Rex config into the running server"
run = "./rex/try.sh"
dir = "{{config_root}}/.."

[tasks."rex:restore"]
description = "Load the deployed Rex config again after rex:try"
run = "./rex/try.sh --restore"
dir = "{{config_root}}/.."
