name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # Not 22.04: its glibc predates Homebrew's minimum, so brew builds
            # its own toolchain there, and gcc's post-install declares an
            # install step the image's pinned brew lacks.
            os: ubuntu-latest
          - name: macos
            os: macos-15
    name: bootstrap (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Link to home
      run: ln -s "$PWD" "$HOME/.dotfiles"
    - name: Add brew bin/ to Linux $PATH
      if: ${{ runner.os == 'Linux' }}
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "${HOMEBREW_PREFIX}/bin" >> "$GITHUB_PATH"
    - name: Install zsh on Linux
      if: ${{ runner.os == 'Linux' }}
      run: sudo apt-get install -y zsh
    - name: Overwrite conflicting formulae
      if: ${{ runner.os == 'macOS' }}
      # The runner's stale bin/openssl points into the openssl@1.1 keg, and the
      # cached Homebrew Backup dir holds a same-inode bin/openssl. Both survive
      # the actions cache, so brew bundle's openssl@3 upgrade fails to back up
      # and relink the symlink every run. Clear both, then relink openssl@3.
      run: |
        rm -f /opt/homebrew/bin/openssl
        rm -rf ~/Library/Caches/Homebrew/Backup
        brew link --overwrite openssl@3 || true
    - name: Cache mise installs
      uses: actions/cache@v6
      with:
        key: mise-${{ runner.os }}-${{ hashFiles('**/mise.toml') }}
        restore-keys: |
          mise-${{ runner.os }}-
        path: |
          ~/.local/share/mise
    - name: Cache Homebrew packages
      uses: actions/cache@v6
      with:
        # runner.os does not distinguish Ubuntu releases, and the cached prefix
        # holds brew itself, so a v3 cache would restore 22.04's brew and glibc.
        key: homebrew-v4-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
        restore-keys: |
          homebrew-v4-${{ runner.os }}-
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Library/Taps
          /home/linuxbrew/.linuxbrew
    - name: Cache cargo-installed binaries
      uses: actions/cache@v6
      with:
        # No repo file hashes to the crate version, so key on run_id: the
        # exact key never pre-exists, the cache (a few MB) re-saves every
        # run, and restore-keys pull the most recent prior save.
        key: cargo-install-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          cargo-install-${{ runner.os }}-
        path: |
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
    # Formulae and casks come from the live API while the image pins brew, so
    # they use DSL it lacks. Must follow the cache restore, which rewrites
    # brew's own prefix. Updates brew only: bottles stay pinned by
    # HOMEBREW_NO_INSTALL_UPGRADE.
    - name: Update Homebrew
      run: brew update
    - name: Print Homebrew configuration
      run: brew config
    - name: Bootstrap
      run: ./scripts/bootstrap
      env:
        # skip updates/upgrades to speed up install and keep cached bottles
        # stable. Upgrades relink against host libs that may be missing on
        # later runs (e.g. bat against libllhttp.so on Linux).
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_UPGRADE: '1'
        # remove stale packages from cache without prompting for confirmation
        # (plain HOMEBREW_BUNDLE_INSTALL_CLEANUP now requires --force/$HOMEBREW_ASK)
        HOMEBREW_BUNDLE_FORCE_INSTALL_CLEANUP: '1'
        # Homebrew's Linux bwrap sandbox breaks source installs: it chowns the
        # build dir to an unmapped supplementary gid and EINVAL is not rescued.
        # Drop once the Landlock backend (opt-in as of 6.0.13) is the default.
        HOMEBREW_NO_SANDBOX_LINUX: '1'
        # skip deps installed without homebrew in https://github.com/actions/virtual-environments/blob/main/images/macos/macos-10.15-Readme.md
        HOMEBREW_BUNDLE_BREW_SKIP: >
          awscli
          go
          golangci-lint
          kubernetes-cli
          kubectx
          minikube
          python
          python@3.11
          python@3.12
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # actions/checkout writes credentials to ~/.gitconfig, which takes
    # precedence over the XDG path (~/.config/git/config) where
    # install-symlinks places the dotfiles git config.
    - name: Remove runner gitconfig so XDG config takes effect
      run: rm -f ~/.gitconfig
    - name: Run topic tests
      run: |
        shopt -s nullglob
        for spec in */.shellspec; do
          dir="${spec%/.shellspec}"
          echo "shellspec $dir"
          (cd "$dir" && shellspec) || exit 1
        done
    - name: Test tmux
      shell: zsh {0}
      run: |
        tmux_stderr=$(mktemp)
        trap 'tmux kill-server 2>/dev/null; rm -f "$tmux_stderr"' EXIT

        tmux_exit=0
        tmux new-session -d -s test 2>"$tmux_stderr" || tmux_exit=$?
        if [[ $tmux_exit -ne 0 ]]; then
          echo "FAIL: tmux new-session exited with code $tmux_exit"
          cat "$tmux_stderr"
          exit 1
        fi
        if [[ -s "$tmux_stderr" ]]; then
          echo "FAIL: tmux new-session wrote to stderr:"
          cat "$tmux_stderr"
          exit 1
        fi

        # tmux = catppuccin/tmux (TPM uses repo name as directory)
        plugin_dir="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins"
        for plugin in tpm tmux-resurrect tmux-continuum tmux tmux-fzf-links; do
          if [[ ! -d "$plugin_dir/$plugin" ]]; then
            echo "FAIL: plugin directory missing: $plugin_dir/$plugin"
            exit 1
          fi
          echo "OK: $plugin_dir/$plugin"
        done

        tmux_assert_opt() {
          local key=$1 expected=$2 val
          if ! val=$(tmux show-options -gv "$key" 2>&1); then
            echo "FAIL: tmux show-options $key failed: $val"
            return 1
          fi
          if [[ -n "$expected" ]] && [[ "$val" != "$expected" ]]; then
            echo "FAIL: $key=$val, expected $expected"
            return 1
          fi
          if [[ -z "$val" ]]; then
            echo "FAIL: $key is empty"
            return 1
          fi
          echo "OK: $key=$val"
        }

        tmux_assert_opt @thm_surface_2 || exit 1
        tmux_assert_opt prefix C-s || exit 1

        # tmux/reload.sh re-sources tmux.conf into this live server. It must
        # leave the sessions alone: sourcing re-runs TPM, which re-runs
        # tmux-continuum, which restores the whole saved session set into a
        # server it reads as freshly started. Zeroing the restore window is what
        # continuum reads as an aged server, and it is also what puts this
        # server past reload.sh's own skip, so this exercises the source path.
        tmux set -g @continuum-restore-max-delay 0
        until (( $(date +%s) - $(tmux display-message -p -F '#{start_time}') >= 1 )); do
          sleep 1
        done

        sessions_before=$(tmux list-sessions -F '#S' | sort | tr '\n' ' ')
        reload_stderr=$(mktemp)
        reload_exit=0
        "$GITHUB_WORKSPACE/tmux/reload.sh" 2>"$reload_stderr" || reload_exit=$?
        if [[ $reload_exit -ne 0 ]]; then
          echo "FAIL: tmux/reload.sh exited with code $reload_exit"
          cat "$reload_stderr"
          exit 1
        fi

        sessions_after=$(tmux list-sessions -F '#S' | sort | tr '\n' ' ')
        if [[ "$sessions_before" != "$sessions_after" ]]; then
          echo "FAIL: reload changed the sessions: [$sessions_before] -> [$sessions_after]"
          exit 1
        fi
        echo "OK: reload left sessions at [$sessions_after]"

        # The config the reload just re-read is still in effect.
        tmux_assert_opt @thm_surface_2 || exit 1
        tmux_assert_opt prefix C-s || exit 1
    - name: Benchmark shell startup
      run: |
        hyperfine --warmup 3 --runs 10 --shell=none \
          'zsh -i -c exit' \
          --export-json /tmp/bench.json \
          --export-markdown /tmp/bench.md

        median=$(python3 -c "import json; print(json.load(open('/tmp/bench.json'))['results'][0]['median'])")

        {
          echo '## Shell Startup Benchmark'
          echo ''
          echo '```'
          hyperfine --warmup 0 --runs 1 --shell=none 'zsh -i -c exit'
          echo '```'
          echo ''
          cat /tmp/bench.md
          echo ''
          ZPROF=1 zsh -i -c exit 2>&1 | bun "$GITHUB_WORKSPACE/zsh/zprof/zprof-format.ts"
          echo ''
        } >> "$GITHUB_STEP_SUMMARY"

        python3 -c "
        import json, sys
        median = json.load(open('/tmp/bench.json'))['results'][0]['median']
        if median > 1.0:
            print(f'FAIL: median startup {median:.3f}s > 1.0s')
            sys.exit(1)
        print(f'OK: median startup {median:.3f}s')
        "
  fzf-links:
    name: fzf-links schemes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Test schemes
        run: uv run --frozen pytest
        working-directory: tmux/search/fzf-links
  zprof:
    name: zprof formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test
        working-directory: zsh/zprof
  skill-tests:
    strategy:
      matrix:
        include:
          - name: linux
            # Not 22.04: its glibc predates Homebrew's minimum, so brew builds
            # its own toolchain there and these specs need no compiler.
            os: ubuntu-latest
          - name: macos
            os: macos-15
    name: skill tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Add brew to Linux PATH
        if: runner.os == 'Linux'
        run: echo "$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install shellspec
        run: brew install shellspec duckdb
      - name: Run tests
        run: |
          for dir in $(find .claude/skills -name .shellspec -exec dirname {} \;); do
            echo "shellspec $dir"
            (cd "$dir" && shellspec) || exit 1
          done
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add brew to PATH
        run: echo "$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install lint dependencies
        run: brew install shellspec ast-grep duckdb
      - uses: j178/prek-action@v3.0.0
      - name: Check completion file naming convention
        run: |
          bad=$(find . -name 'completions.zsh' -not -path './.git/*')
          if [[ -n "$bad" ]]; then
            echo "ERROR: Files named 'completions.zsh' bypass the zshrc completion filter."
            echo "Rename to 'completion.zsh' (singular):"
            echo "$bad"
            exit 1
          fi
      - name: Check topic reload scripts are discoverable
        run: |
          # bin/dotfiles-reload globs <topic>/reload.sh and skips one without
          # the exec bit. Either way it runs nothing and says nothing.
          bad=$(find . -name 'reload.sh' -not -path './.git/*' -not -perm -u+x)
          if [[ -n "$bad" ]]; then
            echo "ERROR: reload scripts are skipped unless executable."
            echo "Run chmod +x on:"
            echo "$bad"
            exit 1
          fi
          deep=$(find . -mindepth 3 -name 'reload.sh' -not -path './.git/*')
          if [[ -n "$deep" ]]; then
            echo "ERROR: bin/dotfiles-reload only globs one level down."
            echo "Move to <topic>/reload.sh:"
            echo "$deep"
            exit 1
          fi
      - name: Check private-use glyphs are declared
        run: bin/glyph-scan

      - name: Check for expired migrations
        run: scripts/lint-expired

      - name: Check tmux/bin aggregate is in sync
        run: |
          # tmux/bin holds a symlink to every topic-bin script (see tmux/bin-sync).
          # Regenerate and fail if the committed tree drifts.
          tmux/bin-sync
          if [ -n "$(git status --porcelain tmux/bin)" ]; then
            echo "ERROR: tmux/bin is out of sync. Run tmux/bin-sync and commit."
            git status --porcelain tmux/bin
            exit 1
          fi
