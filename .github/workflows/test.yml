name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A nightly run with every cache skipped installs today's bottles, mise
  # tools, and plugin heads from scratch, catching the upstream breakage that
  # a cached prefix hides from PRs, and every `ci: :extra` formula PRs skip.
  schedule:
    - cron: '0 9 * * *'
# A push to a PR supersedes the run still testing its previous commit, and
# macOS runners are scarce enough that the stale run delays the new one.
# main keeps every run, since each one saves the caches PRs restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The bun pin, kept out of every config a machine loads.
env:
  MISE_SYSTEM_CONFIG_FILE: ${{ github.workspace }}/.github/mise.toml
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        name: [linux, macos]
        # A PR also takes the upgrade path a machine takes: main installed
        # first, this head over it, then a second run that must change nothing.
        pass: ${{ fromJSON(github.event_name == 'pull_request' && '["fresh", "upgrade"]' || '["fresh"]') }}
        include:
          - name: linux
            # Not 22.04: its glibc predates Homebrew's minimum, so brew builds
            # its own toolchain there, and gcc's post-install declares an
            # install step the image's pinned brew lacks.
            os: ubuntu-latest
          - name: macos
            os: macos-15
    name: bootstrap (${{ matrix.name }}${{ matrix.pass == 'upgrade' && ', upgrade' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        # The merge commit's first parent, for the Brewfile diff below.
        fetch-depth: 2
    # A PR that edits a Brewfile installs every formula, so a change to an
    # extra is proven where it is made.
    - name: Skip extra formulae
      if: ${{ github.event_name != 'schedule' }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)Brewfile$'; then
          echo "A Brewfile changed, so every formula installs."
        else
          echo HOMEBREW_DOTFILES_CORE_ONLY=1 >> "$GITHUB_ENV"
        fi
    # zsh/.zshenv exports XDG_CONFIG_HOME on every machine, and Homebrew keys
    # its trust file on it. Steps outside a zsh script would otherwise read a
    # different trust file on macOS, whose runner leaves it unset.
    - name: Link to home
      run: |
        ln -s "$PWD" "$HOME/.dotfiles"
        echo "XDG_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"
    - name: Add brew bin/ to Linux $PATH
      if: ${{ runner.os == 'Linux' }}
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "${HOMEBREW_PREFIX}/bin" >> "$GITHUB_PATH"
    - name: Install zsh on Linux
      if: ${{ runner.os == 'Linux' }}
      run: sudo apt-get install -y zsh
    - name: Overwrite conflicting formulae
      if: ${{ runner.os == 'macOS' }}
      # The runner's stale bin/openssl points into the openssl@1.1 keg, and the
      # cached Homebrew Backup dir holds a same-inode bin/openssl. Both survive
      # the actions cache, so brew bundle's openssl@3 upgrade fails to back up
      # and relink the symlink every run. Clear both, then relink openssl@3.
      run: |
        rm -f /opt/homebrew/bin/openssl
        rm -rf ~/Library/Caches/Homebrew/Backup
        brew link --overwrite openssl@3 || true
    # Caches are restored here and saved at the end of the job, and only by
    # pushes and dispatches, never by a PR or the uncached nightly run. Branch
    # caches are invisible to other PRs, so a PR's save holds GBs no other run
    # can read, and pushing the repo past its 10 GB cap evicts the main caches
    # every PR restores from.
    - name: Restore mise installs
      id: mise
      if: ${{ github.event_name != 'schedule' }}
      uses: actions/cache/restore@v6
      with:
        # The installs are native binaries, so a runner of another architecture
        # under the same OS label must not restore them. Matches by prefix only,
        # since the save keys on what bootstrap left installed.
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/mise.toml') }}-
        restore-keys: |
          mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/mise.toml') }}-
          mise-${{ runner.os }}-${{ runner.arch }}-
        path: |
          ~/.local/share/mise
    # The cache holds the whole prefix, staged at /opt/homebrew-cached so the
    # restore runs with the image's prefix still in place: its gtar and zstd
    # link libraries by absolute path under /opt/homebrew, so they cannot run
    # from anywhere else. A hit then swaps the staged prefix in. Bootstrap's
    # cleanup leaves the prefix holding exactly the Brewfile, which is what
    # gets saved, and restoring it skips pouring every bottle again.
    - name: Stage the cached Homebrew
      if: ${{ runner.os == 'macOS' }}
      run: sudo install -d -o "$USER" -g admin /opt/homebrew-cached
    - name: Restore Homebrew packages
      id: homebrew
      if: ${{ github.event_name != 'schedule' }}
      uses: actions/cache/restore@v6
      with:
        # runner.os does not distinguish Ubuntu releases, and the cached prefix
        # holds brew itself, so a v3 cache would restore 22.04's brew and glibc.
        # Matches by prefix only, so every run restores the newest prefix main
        # saved. The save keys on what that prefix holds.
        key: homebrew-v6-${{ runner.os }}-
        restore-keys: |
          homebrew-v6-${{ runner.os }}-
        path: |
          /opt/homebrew-cached
          /home/linuxbrew/.linuxbrew
    - name: Swap in the cached Homebrew
      if: ${{ runner.os == 'macOS' && steps.homebrew.outputs.cache-matched-key != '' }}
      run: |
        sudo mv /opt/homebrew /opt/homebrew.image
        sudo mv /opt/homebrew-cached /opt/homebrew
    # herdr reads which plugins are installed from plugins.json, so the plugin
    # trees alone restore as missing and every one is installed again.
    - name: Restore herdr plugins
      id: herdr
      if: ${{ github.event_name != 'schedule' }}
      uses: actions/cache/restore@v6
      with:
        key: herdr-plugins-${{ runner.os }}-${{ hashFiles('herdr/plugins.list') }}
        restore-keys: |
          herdr-plugins-${{ runner.os }}-
        path: |
          ~/.config/herdr/plugins/github
          ~/.config/herdr/plugins.json
    # Formulae and casks come from the live API while the image pins brew, so
    # they use DSL it lacks. Must follow the cache restore, which rewrites
    # brew's own prefix. Also fetches every tap.
    - name: Update Homebrew
      run: brew update
    - name: Print Homebrew configuration
      run: brew config
    # A worktree outside the checkout, so the integration tests and topic
    # globs below never see main's copy. Relinking ~/.dotfiles afterwards is
    # what a sync does to a machine: every installed link follows it.
    - name: Install main
      if: ${{ matrix.pass == 'upgrade' }}
      run: |
        git fetch --no-tags --depth=1 origin main
        git worktree add --detach "$RUNNER_TEMP/main" FETCH_HEAD
        ln -sfn "$RUNNER_TEMP/main" "$HOME/.dotfiles"
        unset DOTFILES_TRACE_DIR
        "$RUNNER_TEMP/main/scripts/bootstrap"
        # install-symlinks resolved ~/.dotfiles to main's worktree. A machine's
        # conf.d names ~/.dotfiles itself, so its mise hooks follow a sync.
        ln -sfn "$HOME/.dotfiles" "$HOME/.config/mise/conf.d"
        ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
      env: &bootstrap-env
        # scripts/shell/trace.sh records a span per step here, for the report
        # and artifact below.
        DOTFILES_TRACE_DIR: ${{ runner.temp }}/trace
        # A debug re-run prints each formula's steps, and GitHub timestamps
        # every log line.
        HOMEBREW_VERBOSE: ${{ runner.debug == '1' && '1' || '' }}
        # skip updates/upgrades to speed up install and keep cached bottles
        # stable. Upgrades relink against host libs that may be missing on
        # later runs (e.g. bat against libllhttp.so on Linux).
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_UPGRADE: '1'
        # remove stale packages from cache without prompting for confirmation
        # (plain HOMEBREW_BUNDLE_INSTALL_CLEANUP now requires --force/$HOMEBREW_ASK)
        HOMEBREW_BUNDLE_FORCE_INSTALL_CLEANUP: '1'
        # Homebrew's Linux bwrap sandbox breaks source installs: it chowns the
        # build dir to an unmapped supplementary gid and EINVAL is not rescued.
        # Drop once the Landlock backend (opt-in as of 6.0.13) is the default.
        HOMEBREW_NO_SANDBOX_LINUX: '1'
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Bootstrap
      id: bootstrap
      # No terminal, as under the nightly LaunchAgent.
      run: ./scripts/bootstrap </dev/null
      env: *bootstrap-env
    - name: Check that skipped formulae still resolve
      if: ${{ matrix.pass == 'fresh' && env.HOMEBREW_DOTFILES_CORE_ONLY }}
      run: |
        comm -13 <(brew bundle list --formula --file=Brewfile | sort) \
          <(env -u HOMEBREW_DOTFILES_CORE_ONLY brew bundle list --formula --file=Brewfile | sort) |
          xargs brew info --formula >/dev/null
    - name: Install again and expect no changes
      if: ${{ matrix.pass == 'upgrade' }}
      run: |
        snapshot() {
          { find "$HOME" -maxdepth 1 -type l; find "$HOME/.config" -type l; } |
            sort | while read -r link; do echo "$link -> $(readlink "$link")"; done
          brew list --versions
          mise ls --installed
          git -C "$HOME/.dotfiles/" status --porcelain
        }
        snapshot > "$RUNNER_TEMP/before"
        unset DOTFILES_TRACE_DIR
        ./scripts/bootstrap
        snapshot > "$RUNNER_TEMP/after"
        diff -u "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
      env: *bootstrap-env
    # A tap line missing `trusted: true` goes untrusted, and a formula named on
    # the command line loads regardless, so only a load of one nobody named,
    # like a `conflicts_with` target, would otherwise notice.
    - name: Check that Brewfile taps stay trusted
      run: |
        brew tap-info --json $(brew bundle list --tap --file=Brewfile) |
          jq -r '[.[] | select(.trusted | not) | .name] | if length > 0 then "untrusted: \(join(" "))\n" | halt_error(1) else empty end'
    - name: Report bootstrap trace
      if: ${{ always() && steps.bootstrap.outcome != 'skipped' }}
      env:
        TRACE: ${{ runner.temp }}/trace
      run: |
        mise x bun -- bun scripts/trace-report "$TRACE" --summary "$TRACE/summary.md" --otlp "$TRACE/otlp.json"
        cat "$TRACE/summary.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload bootstrap trace
      if: ${{ always() && steps.bootstrap.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: bootstrap-trace-${{ matrix.name }}-${{ matrix.pass }}
        path: ${{ runner.temp }}/trace
        if-no-files-found: warn
    # scripts/install puts the mise shims on PATH for its own children only.
    # Later steps reach the pinned tools through these.
    - name: Add mise shims to PATH
      run: echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
    # actions/checkout writes credentials to ~/.gitconfig, which takes
    # precedence over the XDG path (~/.config/git/config) where
    # install-symlinks places the dotfiles git config.
    - name: Remove runner gitconfig so XDG config takes effect
      run: rm -f ~/.gitconfig
    # The suffix is what separates these from the tests the bun job runs on a
    # bare checkout: they read the installed symlinks and the packages brew
    # bundle put on this runner, so bootstrap is what makes them meaningful.
    # The first nvim start clones every plugin and compiles every treesitter
    # parser. Restored after Bootstrap, so the key sees the nvim it installed,
    # and matched exactly, so any change to these rebuilds from scratch.
    - name: Key neovim plugins and parsers
      id: nvim-key
      if: ${{ github.event_name != 'schedule' }}
      run: echo "key=nvim-$RUNNER_OS-$RUNNER_ARCH-$(nvim --version | head -1 | tr ' ' '-')-${{ hashFiles('neovim/config/nvim-pack-lock.json', 'neovim/config/lua/config/treesitter.lua') }}" >> "$GITHUB_OUTPUT"
    - name: Restore neovim plugins and parsers
      id: nvim
      if: ${{ github.event_name != 'schedule' }}
      uses: actions/cache/restore@v6
      with:
        key: ${{ steps.nvim-key.outputs.key }}
        path: ~/.local/share/nvim
    - name: Run topic integration tests
      run: bun test integration.test.ts
    - name: Benchmark shell startup
      run: |
        hyperfine --warmup 3 --runs 10 --shell=none --input null \
          'zsh -i' \
          --export-json /tmp/bench.json \
          --export-markdown /tmp/bench.md

        {
          echo '## Shell Startup Benchmark'
          echo ''
          echo '```'
          hyperfine --warmup 0 --runs 1 --shell=none --input null 'zsh -i'
          echo '```'
          echo ''
          cat /tmp/bench.md
          echo ''
          ZPROF=1 zsh -i -c exit 2>&1 | bun "$GITHUB_WORKSPACE/zsh/zprof/zprof-format.ts"
          echo ''
        } >> "$GITHUB_STEP_SUMMARY"

        python3 -c "
        import json, sys
        median = json.load(open('/tmp/bench.json'))['results'][0]['summary']['time_wall_clock']['median']
        if median > 1.0:
            print(f'FAIL: median startup {median:.3f}s > 1.0s')
            sys.exit(1)
        print(f'OK: median startup {median:.3f}s')
        "
    # The agents bootstrap loads keep writing under ~/.local/share/mise, and tar
    # aborts the post-job cache save on a file that changed while it read it.
    # Labels come from the repo's own plists and the dev.mise.* ones mise
    # writes from [bootstrap.macos.launchd.agents], never the runner's.
    - name: Stop the launchd agents bootstrap loaded
      if: ${{ always() && runner.os == 'macOS' }}
      run: |
        for plist in */*.plist ~/Library/LaunchAgents/dev.mise.*.plist; do
          label=$(plutil -extract Label raw "$plist" 2>/dev/null) || continue
          launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
        done
    # A repaired install moves its executables, so keying on their paths saves
    # once per repair rather than once per mise release.
    - name: Key mise installs by their executables
      id: mise-installed
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      run: |
        hash=$(mise bin-paths | shasum -a 256 | cut -c1-64)
        echo "key=mise-$RUNNER_OS-$RUNNER_ARCH-${{ hashFiles('**/mise.toml') }}-$hash" >> "$GITHUB_OUTPUT"
    - name: Save mise installs
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.mise.outputs.cache-matched-key != steps.mise-installed.outputs.key }}
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.mise-installed.outputs.key }}
        path: |
          ~/.local/share/mise
    # brew bundle upgrades whatever the API has moved past, so a prefix keyed
    # on the Brewfile alone would go stale and every run would redo the same
    # upgrades. Keying on the installed versions saves whenever they move.
    - name: Key Homebrew by its installed versions
      id: homebrew-versions
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      run: |
        hash=$(brew list --formula --versions | shasum -a 256 | cut -c1-64)
        echo "key=homebrew-v6-$RUNNER_OS-$hash" >> "$GITHUB_OUTPUT"
    # The save reads the prefix from where the restore writes it, and the
    # link keeps the zstd it compresses with resolving its libraries.
    - name: Stage Homebrew for saving
      if: ${{ runner.os == 'macOS' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.homebrew.outputs.cache-matched-key != steps.homebrew-versions.outputs.key }}
      run: |
        sudo rm -rf /opt/homebrew-cached
        sudo mv /opt/homebrew /opt/homebrew-cached
        sudo ln -s /opt/homebrew-cached /opt/homebrew
    - name: Save Homebrew packages
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.homebrew.outputs.cache-matched-key != steps.homebrew-versions.outputs.key }}
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.homebrew-versions.outputs.key }}
        path: |
          /opt/homebrew-cached
          /home/linuxbrew/.linuxbrew
    - name: Save neovim plugins and parsers
      if: ${{ matrix.pass == 'fresh' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.nvim.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.nvim-key.outputs.key }}
        path: ~/.local/share/nvim
    - name: Save herdr plugins
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.herdr.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.herdr.outputs.cache-primary-key }}
        path: |
          ~/.config/herdr/plugins/github
          ~/.config/herdr/plugins.json
  bun:
    name: bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.2.0
      # The tests that drive shell scripts stub what those scripts call, but
      # the interpreters and the tools a script legitimately uses are real.
      # zsh is the one the image does not already carry.
      - name: Install shells the tests drive
        run: sudo apt-get install -y zsh
      - name: Add brew to PATH
        run: echo "$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)/bin" >> "$GITHUB_PATH"
      # The spin tests that cover the no-terminal branch run the real gum,
      # because a stub cannot show what its spinner writes to stderr.
      - name: Install gum
        run: brew install gum
      # The integration tests read state only bootstrap creates, so they run
      # there instead. The skill tests need duckdb and have their own job;
      # discovery skips their dot directory, and the pattern says so on purpose.
      # lint-ts drives the pinned oxlint, so its tests run in the lint job,
      # which installs it. This job stays a bare checkout on purpose: a #
      # specifier resolving with no node_modules is what the 3am jobs need.
      # The test script in package.json carries those ignores, installs
      # aws/vm's own dependencies, and runs each file in a worker process of
      # its own, one per core.
      # It also records each file's duration and reads the last record back
      # to start the slowest files first. Only main saves one, so a PR starts
      # from main's newest. Entries cannot be overwritten, hence one per commit.
      - name: Restore test timings
        uses: actions/cache/restore@v6
        with:
          path: tmp/test-timings.json
          key: bun-test-timings-${{ github.sha }}
          restore-keys: bun-test-timings-
      - run: bun run test
      - name: Save test timings
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: tmp/test-timings.json
          key: bun-test-timings-${{ github.sha }}
  skill-tests:
    strategy:
      matrix:
        include:
          - name: linux
            # Not 22.04: its glibc predates Homebrew's minimum, so brew builds
            # its own toolchain there and these tests need no compiler.
            os: ubuntu-latest
          - name: macos
            os: macos-15
    name: skill tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The pins live in a topic file that reaches mise through a conf.d link
    # only bootstrap lays, so name it here for mise-action and the shims.
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/system/mise.toml
    steps:
      - uses: actions/checkout@v7
      # The skill under test queries shell history through duckdb, and builds
      # its own fixture database the same way.
      - uses: jdx/mise-action@v5.2.0
        with:
          install_args: bun aqua:duckdb/duckdb
      # A leading ./ is what makes bun read this as a path. Bare, it is a filter
      # matched against discovered files, and discovery skips dot directories.
      - name: Run tests
        run: bun test ./.claude/skills/ ./.claude/hooks/
  lint:
    runs-on: ubuntu-latest
    # The pins live in a topic file that reaches mise through a conf.d link
    # only bootstrap lays, so name it here for mise-action and the shims.
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/system/mise.toml
    steps:
      - uses: actions/checkout@v7
        with:
          # lint:secrets reads history, which a shallow checkout omits.
          fetch-depth: 0
      - name: Install lint dependencies
        uses: jdx/mise-action@v5.2.0
      # Homebrew's libxml2 is keg-only, so apt is what puts xmllint on PATH.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      # herdr is not installed here and its formula has no Linux bottle, so the
      # config check runs in bootstrap instead, where brew bundle put it.
      # The prek pinned in system/mise.toml rather than prek-action's own, so a
      # Renovate bump to it runs here before it reaches a machine.
      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: herdr-config
      # Every check reports, rather than the first failure hiding the rest.
      # Interleaved output keeps lint-ts's annotations at the start of a line,
      # where GitHub reads them.
      - name: Lint
        run: mise run --continue-on-error --output interleave lint
