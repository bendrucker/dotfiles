# Agents that run Claude, loaded only on the machine mise/miserc.toml.tera
# selects as the Claude host.

# Keeps a Remote Control server up in ~/src so claude.ai projects can start
# sessions on this machine without a terminal or the desktop app open. Sessions
# start only on request, so no idle one sits in the list under a generated name.
[bootstrap.macos.launchd.agents.claude-remote-control]
program = "~/.local/bin/claude"
args = ["remote-control", "--no-create-session-in-dir"]
working_directory = "{{ env.HOME }}/src"
run_at_load = true
keep_alive = true
throttle_interval = 60
stdout_path = "~/Library/Logs/claude-remote-control.log"
stderr_path = "~/Library/Logs/claude-remote-control.log"
environment = { PATH = "{{ env.HOME }}/.local/bin:{{ env.HOME }}/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
