# The Homebrew cask installs a .pkg, which needs sudo, so the nightly upgrade
# would fail on every new release. aqua fetches the same AWS binary unprivileged.
[tools]
"aqua:aws/aws-cli" = "2.38.1"
"aqua:aws/session-manager-plugin" = { version = "1.2.835.0", os = ["macos"] }

[tasks."aws:install"]
run = "./aws/install.sh"
dir = "{{config_root}}/.."
