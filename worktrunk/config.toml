worktree-path = "~/src/.worktrees/{{ owner }}/{{ repo }}/{{ branch | sanitize }}"

[[pre-start]]
claude-trust = "claude-trust-worktree '{{ primary_worktree_path }}' '{{ worktree_path }}'"

[[pre-start]]
overlay = "claude-overlay link '{{ worktree_path }}' || true"

[list]
summary = true

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
